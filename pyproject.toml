[project]
name = "cutter"
version = "0.1.0"
description = "汉字字典切图工作台：中华字海 / 汉字海 / 康熙字典 / 汉语大字典"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "scipy>=1.11",
    "pymupdf>=1.24",
    "pillow>=10.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.17.5",
    "pyright>=1.1.414",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = [
    "backend/app/pipelines/upstream",  # 上游算法逐字复制，不改风格
    "backend/var",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # 行宽交给 formatter
    "RUF001", # 中文全角标点在字符串里是正常的
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["B011"]

[tool.pyright]
include = ["backend/app", "backend/tests"]
exclude = ["backend/app/pipelines/upstream", "backend/var"]
typeCheckingMode = "basic"
pythonVersion = "3.11"
reportMissingTypeStubs = false
